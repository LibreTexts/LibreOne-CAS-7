name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to label the Docker image under'
        required: true
        type: string

jobs:
  check_authorization:
    name: Check authorization to publish new Docker image
    runs-on: ubuntu-latest
    outputs:
      isAuthorized: ${{ steps.check-auth.outputs.is_authorized }}
    steps:
      - name: check-auth
        id: check-auth
        run: echo "is_authorized=${{ contains(secrets.DEPLOYMENT_AUTHORIZED_USERS, github.triggering_actor) }}" >> $GITHUB_OUTPUT

  # Each arch builds natively and pushes an untagged image by digest. The merge job tags both under one manifest list.
  build_amd64:
    name: Build Docker image (amd64)
    needs: check_authorization
    if: needs.check_authorization.outputs.isAuthorized == 'true'
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux/amd64
    permissions: &publish_permissions
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps: &build_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ env.PLATFORM }}
          provenance: false
          outputs: type=image,name=ghcr.io/libretexts/libreone-cas,push-by-digest=true,name-canonical=true,push=true

  build_arm64:
    name: Build Docker image (arm64)
    needs: check_authorization
    if: needs.check_authorization.outputs.isAuthorized == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      PLATFORM: linux/arm64
    permissions: *publish_permissions
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps: *build_steps

  merge:
    name: Publish multi-arch image
    needs: [build_amd64, build_arm64]
    runs-on: ubuntu-latest
    permissions: *publish_permissions
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        env:
          IMAGE: ghcr.io/libretexts/libreone-cas
          VERSION: ${{ inputs.version }}
          AMD64_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build_arm64.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
